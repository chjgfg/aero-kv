[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- Solana 核心 (建议后续升级到 1.18+，目前保持原样以免破坏代码) ---
anchor-client = { version = "0.30.1" }
solana-sdk = { version = "1.18.13", features = ["full"] }
solana-client = { version = "1.18.13" }

# --- 序列化 & 工具 ---
thiserror = "1.0"
dotenv = "0.15.0" 
# 合约
contract = { path = "../contract/programs/contract", features = ["cpi"] }

# 异步与 HTTP
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.8.9", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- 日志（必须加！）---
# 日志与时间
simplelog = "0.12"
log = "0.4.20"
time = { version = "0.3", features = ["macros", "local-offset"] }

once_cell = "1.21.4"
base64 = "0.22.1"
bs58 = { version = "0.5", features = ["check"] }