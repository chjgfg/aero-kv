[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- Solana 核心 (建议后续升级到 1.18+，目前保持原样以免破坏代码) ---
anchor-client = "0.30.1"
# solana-sdk = "1.18"
# solana-client = "1.18"
solana-sdk = { version = "1.18.13", features = ["full"] }
solana-client = { version = "1.18.13" }
# solana-transaction-status = "1.18"
# solana-program = "1.18"
# solana-account-decoder = "1.18"
# spl-token = "4.0" # 需要这个库来解析账户数据
# tiny-bip39 = "0.8.2"

# --- Web 框架 & 异步运行时 ---
actix-web = "4.3.1"
actix-cors = "0.7"  # 请根据最新版本调整
# 异步
tokio = { version = "1.45.1", features = ["full"] }


# --- 序列化 & 工具 ---
# 处理日期、时间
chrono = "0.4.22"
thiserror = "1.0"
# 处理JSON
serde_json = "1.0"
# 序列化/反序列化
serde = { version = "1.0", features = ["derive"] }
# 错误处理
anyhow = "1"
# 生成唯一识别码
uuid = { version = "1.3", features = ["v4"] }
# URL 构建、解析
url = "2.0"
once_cell = "1.19"

# # --- 加密 & 签名 ---
# # 加密签名
# ring = "0.17"
# # 新增以下依赖用于计算签名
# hmac = "0.12"
# sha2 = "0.10"
# base64 = "0.21"
hex = "0.4.3"
aes-gcm = "0.10"
rand = "0.8"

# # --- TLS 底层支持 ---
# native-tls = "0.2.14"      # 必须有这个处理加密
# tokio-native-tls = "0.3.1" # 必须有这个

actix = "0.13.5"
actix-web-actors = "4.3.1"
dotenv = "0.15.0" 
# 合约
contract = { path = "../contract/programs/contract", features = ["cpi"] }